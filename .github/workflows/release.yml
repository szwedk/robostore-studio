name: Build RoboStore Studio

# Builds installers for macOS (Apple Silicon + Intel) and Linux and attaches them
# to a draft GitHub Release. Tag a version (e.g. v0.1.0) or run manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# tauri-action creates/updates a GitHub Release with the installers.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon
            triple: aarch64-apple-darwin
          - os: macos-13      # Intel
            triple: x86_64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: System deps (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install libusb

      - name: System deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Engine deps + freeze sidecar
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pyserial "bc-stark-sdk==1.4.2" pyinstaller
          PYTHON=python ./scripts/build-sidecar.sh

      - name: Vendor offline camera assets
        run: ./scripts/fetch-camera-assets.sh

      - name: UI deps
        working-directory: app
        run: npm ci   # icons are committed under src-tauri/icons/ (regenerate with `npm run icons`)

      - name: Build app (signed if Apple secrets present, else ad-hoc)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          args: --target ${{ matrix.triple }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'studio-dev' }}
          releaseName: "RoboStore Studio ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            **RoboStore Studio** — control, learn, and develop with your BrainCo Revo2 hand.

            ### Download
            - **macOS — Apple Silicon:** `*_aarch64.dmg`
            - **macOS — Intel:** `*_x64.dmg`
            - **Linux:** `*.AppImage` (portable) or `*.deb`

            ### Install (macOS)
            1. Open the `.dmg`, drag **RoboStore Studio** to Applications.
            2. First launch: **right-click the app → Open** (it's unsigned for now).
               If it says *"damaged"*, run once: `xattr -cr "/Applications/RoboStore Studio.app"`
            3. It starts in **Simulator**. Plug the hand into USB → pick it from the
               device menu (top-right). Enter your license code when prompted.

            Everything is bundled — no Python, terminal, or extra installs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code-signing + notarization (no Gatekeeper warning) ──
          # Requires an Apple Developer account. To enable: add these repo secrets
          # (Settings → Secrets and variables → Actions), UNCOMMENT the six lines
          # below, and re-add `"entitlements": "Entitlements.plist"` under
          # bundle.macOS in tauri.conf.json. Until then the build is ad-hoc unsigned
          # (works, but users must right-click → Open / xattr). Do NOT uncomment
          # with the secrets unset — an empty cert makes the build fail.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Repackage the macOS .dmg with appdmg so the first-run helper + Read Me sit
      # at fixed, tidy positions (Tauri can't position extra DMG icons). appdmg
      # writes the .DS_Store deterministically — no flaky Finder scripting.
      #
      # IMPORTANT: we source the app by MOUNTING the .dmg Tauri just built, not by
      # finding the .app in the target dir — Tauri's updater bundler deletes
      # ("Cleans") bundle/macos/*.app immediately after it builds the dmg, so the
      # .app is gone by the time this step runs. The .dmg is the only guaranteed
      # artifact, and `ditto` from it preserves the ad-hoc code signature.
      # Best-effort: if anything fails, Tauri's clean app→Applications .dmg ships.
      - name: Repackage DMG with helper files (appdmg)
        if: startsWith(matrix.os, 'macos') && github.ref_type == 'tag'
        continue-on-error: true
        run: |
          npm i -g appdmg
          SRC_DMG=$(find . -path "*/release/bundle/dmg/*.dmg" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          if [ -z "$SRC_DMG" ]; then
            echo "no source dmg found, skipping. bundle tree:"
            find . -path "*/release/bundle/*" -not -path "*/node_modules/*" -maxdepth 8 2>/dev/null | head -20
            exit 0
          fi
          echo "source dmg: $SRC_DMG"
          WORK=$(mktemp -d)
          MP=$(hdiutil attach -nobrowse -noverify -noautoopen "$SRC_DMG" | grep -o '/Volumes/.*' | head -1)
          echo "mounted at: $MP"
          ditto "$MP/RoboStore Studio.app" "$WORK/RoboStore Studio.app"
          hdiutil detach "$MP" >/dev/null || true
          cp "dmg-extras/Open RoboStore Studio.command" "$WORK/"
          cp "dmg-extras/Read Me.txt" "$WORK/"
          cp "dmg-extras/dmg-background.png" "$WORK/background.png"
          cp "dmg-extras/appdmg-spec.json" "$WORK/spec.json"
          VER=$(node -p "require('./app/package.json').version")
          ARCH=$([ "${{ matrix.triple }}" = "aarch64-apple-darwin" ] && echo aarch64 || echo x64)
          OUT="RoboStore Studio_${VER}_${ARCH}.dmg"
          ( cd "$WORK" && appdmg spec.json "$OUT" )
          # sanity-check the repackaged dmg actually contains the helper files
          CHK=$(hdiutil attach -nobrowse -noverify -noautoopen "$WORK/$OUT" | grep -o '/Volumes/.*' | head -1)
          ls -la "$CHK"
          hdiutil detach "$CHK" >/dev/null || true
          gh release upload "${{ github.ref_name }}" "$WORK/$OUT" --clobber -R "${{ github.repository }}"
          # also keep the standalone helper + read me as assets
          gh release upload "${{ github.ref_name }}" \
            "dmg-extras/Open RoboStore Studio.command" "dmg-extras/Read Me.txt" \
            --clobber -R "${{ github.repository }}" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
